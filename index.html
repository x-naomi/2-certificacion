<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viajero Frecuente</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Viajero Frecuente</h1>

    <div class="columnas">
        <div>
            <h2>Registro</h2>
            {% for mensaje in get_flashed_messages(category_filter=['registro']) %}
                <p class="alerta">{{ mensaje }}</p>
            {% endfor %}
            <form action="/registro" method="post">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre">

                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido">

                <label for="email">E-mail</label>
                <input type="text" id="email" name="email">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password">

                <label for="conf_password">Conf. Contraseña</label>
                <input type="password" id="conf_password" name="conf_password">

                <button type="submit">Registrar</button>
            </form>
        </div>

        <div>
            <h2>Inicio de Sesión</h2>
            {% for mensaje in get_flashed_messages(category_filter=['login']) %}
                <p class="alerta">{{ mensaje }}</p>
            {% endfor %}
            <form action="/login" method="post">
                <label for="email_login">E-mail</label>
                <input type="text" id="email_login" name="email">

                <label for="password_login">Contraseña</label>
                <input type="password" id="password_login" name="password">

                <button type="submit">Iniciar Sesión</button>
            </form>
        </div>
    </div>
</body>
</html>
